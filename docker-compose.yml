services:
  # 1. MySQL 8 Database (Isolated Internal Network - No Public Port Exposure)
  mysql:
    image: mysql:8.0
    container_name: nursery_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nursery_root_secure_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nursery_db}
      MYSQL_USER: ${MYSQL_USER:-nursery_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nursery_secure_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nursery_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-nursery_root_secure_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 2. Node.js & Express API Backend Services (Internal Network Only)
  services:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: nursery_services
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mysql://${MYSQL_USER:-nursery_user}:${MYSQL_PASSWORD:-nursery_secure_pass_2026}@mysql:3306/${MYSQL_DATABASE:-nursery_db}"
      JWT_SECRET: ${JWT_SECRET:-secret_jwt_ktmbotanica_access_token_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-secret_jwt_ktmbotanica_refresh_token_key_2026}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo_nursery_cloud}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-123456789012345}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-your_cloudinary_api_secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ESEWA_PRODUCT_CODE: ${ESEWA_PRODUCT_CODE:-EPAYTEST}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-8gBm/:&EnhH.1/q}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nursery_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # 3. Nginx + React 19 Frontend Web (Public Gateway - Exposes Port 80)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nursery_web
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    depends_on:
      services:
        condition: service_healthy
    networks:
      - nursery_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
    driver: local

networks:
  nursery_internal:
    driver: bridge
